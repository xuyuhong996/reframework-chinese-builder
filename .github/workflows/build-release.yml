name: Build and release REFramework Chinese

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reframework-chinese-build
  cancel-in-progress: false

jobs:
  decide:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.interval.outputs.should_build }}
      upstream_release_tag: ${{ steps.interval.outputs.upstream_release_tag }}
    steps:
      - id: interval
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_BUILD: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          upstream_release_tag=$(gh api 'repos/praydog/REFramework-nightly/releases/latest' --jq '.tag_name')
          echo "upstream_release_tag=$upstream_release_tag" >> "$GITHUB_OUTPUT"

          if [ "$FORCE_BUILD" = "true" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest_notes=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.body' 2>/dev/null || true)
          if printf '%s' "$latest_notes" | grep -Fq "Nightly 发布: $upstream_release_tag"; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_build=true" >> "$GITHUB_OUTPUT"

  build:
    needs: decide
    if: needs.decide.outputs.should_build == 'true'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build localized ZIP
        env:
          SKIP_GITHUB_PUBLISH: "1"
        shell: pwsh
        run: python build_chinese.py

      - name: Create historical release
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_RELEASE_TAG: ${{ needs.decide.outputs.upstream_release_tag }}
        shell: pwsh
        run: |
          $package = Get-ChildItem -Filter 'REF Nightly *.zip' -File |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if ($null -eq $package) { throw '未找到构建生成的 ZIP。' }

          $hash = (Get-FileHash -LiteralPath $package.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $nightlyNumber = $env:UPSTREAM_RELEASE_TAG -replace '^nightly-', ''
          $releaseTitle = "REFramework-汉化-$nightlyNumber"
          $releaseAssetBase = "REFramework-$nightlyNumber"
          $releasePackage = Join-Path $package.DirectoryName "$releaseAssetBase.zip"
          $checksum = "$releasePackage.sha256"
          Copy-Item -LiteralPath $package.FullName -Destination $releasePackage
          Set-Content -LiteralPath $checksum -Value "$hash  $releaseAssetBase.zip" -Encoding ascii
          $tag = "build-$($hash.Substring(0, 12))"
          # GitHub 会过滤中文附件名；使用稳定的 ASCII 名称，中文名称保留在 Release 标题。

          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host '这个 ZIP 已有历史发布版本，不重复创建。'
            exit 0
          }

          gh release create $tag $releasePackage $checksum `
            --repo $env:GITHUB_REPOSITORY `
            --title $releaseTitle `
            --notes "由 GitHub Actions 的 Windows Visual Studio 2022 环境自动构建。`n`nNightly 发布: $env:UPSTREAM_RELEASE_TAG"
