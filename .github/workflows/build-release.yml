name: Build and release REFramework Chinese

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      check_only:
        description: "仅检查版本，不重新打包"
        type: boolean
        default: false
      publish_release:
        description: "正式发布；关闭时仅保存测试包"
        type: boolean
        default: true

permissions:
  contents: write

env:
  PYTHONUTF8: "1"

concurrency:
  group: reframework-chinese-build
  cancel-in-progress: false

jobs:
  decide:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.interval.outputs.should_build }}
      upstream_release_tag: ${{ steps.interval.outputs.upstream_release_tag }}
      upstream_sha: ${{ steps.interval.outputs.upstream_sha }}
    steps:
      - id: interval
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_BUILD: ${{ github.event_name == 'workflow_dispatch' }}
          CHECK_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.check_only }}
        shell: bash
        run: |
          upstream_release_tag=$(gh api 'repos/praydog/REFramework-nightly/releases/latest' --jq '.tag_name')
          if [[ ! "$upstream_release_tag" =~ ^nightly-([0-9]{5})-([0-9a-f]{40})$ ]]; then
            echo "官方 Nightly 标签格式无法识别，已停止构建，避免生成错误版本。" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          upstream_sha=${BASH_REMATCH[2]}
          echo "upstream_release_tag=$upstream_release_tag" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=$upstream_sha" >> "$GITHUB_OUTPUT"

          latest_release=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" 2>/dev/null || true)
          latest_title=$(printf '%s' "$latest_release" | jq -r '.name // "尚未发布"')
          latest_notes=$(printf '%s' "$latest_release" | jq -r '.body // ""')
          {
            echo "## 汉化版本检查"
            printf '官方 Nightly 标签：`%s`\n\n' "$upstream_release_tag"
            printf '官方源码提交：`%s`\n\n' "$upstream_sha"
            printf '本仓库最新发布：%s\n\n' "${latest_title:-尚未发布}"
            printf '[下载最新汉化包](https://github.com/%s/releases/latest)\n\n' "$GITHUB_REPOSITORY"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$CHECK_ONLY" = "true" ]; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            if printf '%s' "$latest_notes" | grep -Fq "Nightly 发布: $upstream_release_tag"; then
              echo "本次结果：仅检查版本；汉化已与官方 Nightly 同步。" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "本次结果：仅检查版本；尚未发布对应的官方 Nightly。" >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 0
          fi

          if [ "$FORCE_BUILD" = "true" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "本次结果：手动触发，继续重新构建。" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if printf '%s' "$latest_notes" | grep -Fq "Nightly 发布: $upstream_release_tag"; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "本次结果：版本已同步，官方没有新 Nightly，正常跳过打包。" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "should_build=true" >> "$GITHUB_OUTPUT"
          echo "本次结果：尚未发布对应的官方 Nightly，继续汉化打包。" >> "$GITHUB_STEP_SUMMARY"

  verify:
    needs: decide
    if: needs.decide.outputs.should_build == 'true'
    uses: ./.github/workflows/verify.yml
    permissions:
      contents: read

  build:
    needs: [decide, verify]
    if: needs.decide.outputs.should_build == 'true'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - name: Checkout matching official source
        uses: actions/checkout@v7
        with:
          repository: praydog/REFramework
          ref: ${{ needs.decide.outputs.upstream_sha }}
          path: REFramework-src
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build localized ZIP
        env:
          SKIP_GITHUB_PUBLISH: "1"
          REF_OUTPUT_DIR: ${{ github.workspace }}
          UPSTREAM_SHA: ${{ needs.decide.outputs.upstream_sha }}
          UPSTREAM_RELEASE_TAG: ${{ needs.decide.outputs.upstream_release_tag }}
        shell: pwsh
        run: python build_chinese.py

      - name: Verify complete package
        env:
          UPSTREAM_RELEASE_TAG: ${{ needs.decide.outputs.upstream_release_tag }}
        shell: pwsh
        run: |
          $nightlyNumber = ($env:UPSTREAM_RELEASE_TAG -split '-')[1]
          python -m scripts.release_artifacts "REFramework-Nightly-$nightlyNumber.zip" `
            --upstream-tag $env:UPSTREAM_RELEASE_TAG --builder-sha $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw '新包来源或 DLL 验证失败，停止发布。' }
          $buildRecord = Get-Content -LiteralPath "REFramework-Nightly-$nightlyNumber.zip.build.json" -Raw -ErrorAction Stop
          @('### 构建校验记录', '', '```json', $buildRecord, '```') |
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8

      - name: Save test package
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish_release }}
        uses: actions/upload-artifact@v7
        with:
          name: REFramework-Nightly-test-${{ github.run_id }}
          path: REFramework-Nightly-*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Create historical release
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_release }}
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_RELEASE_TAG: ${{ needs.decide.outputs.upstream_release_tag }}
        shell: pwsh
        run: |
          "created=false" >> $env:GITHUB_OUTPUT
          if ($env:UPSTREAM_RELEASE_TAG -notmatch '^nightly-(\d+)') {
            throw "无法识别 Nightly 编号: $env:UPSTREAM_RELEASE_TAG"
          }
          $nightlyNumber = $Matches[1]
          $releaseTitle = "REFramework-Nightly-汉化-$nightlyNumber"
          $releaseAssetBase = "REFramework-Nightly-$nightlyNumber"
          $package = Get-Item -LiteralPath "$releaseAssetBase.zip" -ErrorAction SilentlyContinue
          if ($null -eq $package -or $package.PSIsContainer) { throw '未找到构建生成的 ZIP。' }

          $hash = (Get-FileHash -LiteralPath $package.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $releasePackage = $package.FullName
          $buildRecord = "$releasePackage.build.json"
          if (-not (Test-Path -LiteralPath $buildRecord -PathType Leaf)) { throw '缺少包外构建记录。' }
          $tag = "build-$($hash.Substring(0, 12))"
          # GitHub 会过滤中文附件名；使用稳定的 ASCII 名称，中文名称保留在 Release 标题。

          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host '这个 ZIP 已有历史发布版本，不重复创建。'
            exit 0
          }

          # 附注标签记录本次发布时间，并准确指向参与构建的仓库提交。
          git -c 'user.name=github-actions[bot]' -c 'user.email=41898282+github-actions[bot]@users.noreply.github.com' `
            tag --annotate $tag $env:GITHUB_SHA --message $releaseTitle
          if ($LASTEXITCODE -ne 0) { throw '发布标签创建失败。' }
          git push origin "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw '发布标签推送失败。' }

          gh release create $tag $releasePackage `
            --repo $env:GITHUB_REPOSITORY `
            --verify-tag --latest `
            --title $releaseTitle `
            --notes "由 GitHub Actions 的 Windows Visual Studio 2022 环境自动构建。`n`nNightly 发布: $env:UPSTREAM_RELEASE_TAG`n`nZIP SHA256: $hash"
          if ($LASTEXITCODE -ne 0) { throw 'GitHub 新包发布失败。' }

          "created=true" >> $env:GITHUB_OUTPUT
