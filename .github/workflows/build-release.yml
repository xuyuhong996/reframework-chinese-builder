name: Build and release REFramework Chinese

on:
  push:
    branches: [main]
    paths:
      - build_chinese.py
      - scripts/release_packages.py
      - translations.txt
      - hash_dict.txt
      - .github/workflows/build-release.yml
  pull_request:
    paths:
      - build_chinese.py
      - scripts/release_packages.py
      - tests/**
      - .github/workflows/build-release.yml
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      check_only:
        description: "仅检查版本，不重新打包"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: reframework-chinese-${{ github.event.pull_request.number || 'release' }}
  cancel-in-progress: false

jobs:
  decide:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.interval.outputs.should_build }}
      upstream_release_tag: ${{ steps.interval.outputs.upstream_release_tag }}
      upstream_sha: ${{ steps.interval.outputs.upstream_sha }}
    steps:
      - id: interval
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_BUILD: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || github.event_name == 'push' }}
          CHECK_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.check_only }}
        shell: bash
        run: |
          upstream_release_tag=$(gh api 'repos/praydog/REFramework-nightly/releases/latest' --jq '.tag_name')
          if [[ ! "$upstream_release_tag" =~ ^nightly-([0-9]{5})-([0-9a-f]{40})$ ]]; then
            echo "官方 Nightly 标签格式无法识别，已停止构建，避免生成错误版本。" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          upstream_sha=${BASH_REMATCH[2]}
          echo "upstream_release_tag=$upstream_release_tag" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=$upstream_sha" >> "$GITHUB_OUTPUT"

          latest_release=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" 2>/dev/null || true)
          latest_title=$(printf '%s' "$latest_release" | jq -r '.name // "尚未发布"')
          latest_notes=$(printf '%s' "$latest_release" | jq -r '.body // ""')
          release_matches=false
          if printf '%s' "$latest_notes" | grep -Fq "Nightly 发布: $upstream_release_tag" &&
             printf '%s' "$latest_notes" | grep -Fq 'Release layout: official-nightly'; then
            release_matches=true
          fi
          {
            echo "## 汉化版本检查"
            printf '官方 Nightly 标签：`%s`\n\n' "$upstream_release_tag"
            printf '官方源码提交：`%s`\n\n' "$upstream_sha"
            printf '本仓库最新发布：%s\n\n' "${latest_title:-尚未发布}"
            printf '[下载最新汉化包](https://github.com/%s/releases/latest)\n\n' "$GITHUB_REPOSITORY"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$CHECK_ONLY" = "true" ]; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            if [ "$release_matches" = "true" ]; then
              echo "本次结果：仅检查版本；汉化主包与官方同版本配套包均已发布。" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "本次结果：仅检查版本；尚未发布对应的新结构汉化包。" >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 0
          fi

          if [ "$FORCE_BUILD" = "true" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "本次结果：代码更新或手动触发，继续构建；合并请求只验证，不发布。" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$release_matches" = "true" ]; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "本次结果：版本已同步，官方没有新 Nightly，正常跳过打包。" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "should_build=true" >> "$GITHUB_OUTPUT"
          echo "本次结果：尚未发布对应的官方 Nightly，继续汉化打包。" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: decide
    if: needs.decide.outputs.should_build == 'true'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Checkout matching official source
        uses: actions/checkout@v7
        with:
          repository: praydog/REFramework
          ref: ${{ needs.decide.outputs.upstream_sha }}
          path: REFramework-src
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Test localization and packaging
        run: python -m unittest discover -s tests -v

      - name: Build localized ZIP
        env:
          SKIP_GITHUB_PUBLISH: "1"
          UPSTREAM_SHA: ${{ needs.decide.outputs.upstream_sha }}
          UPSTREAM_RELEASE_TAG: ${{ needs.decide.outputs.upstream_release_tag }}
        shell: pwsh
        run: python build_chinese.py

      - name: Prepare official-layout release
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_RELEASE_TAG: ${{ needs.decide.outputs.upstream_release_tag }}
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem -Filter 'REF Nightly *.zip' -File)
          if ($packages.Count -ne 1) { throw '应当且只能生成一个汉化主包。' }
          python scripts/release_packages.py $packages[0].FullName --tag $env:UPSTREAM_RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { throw '汉化主包或官方配套包验证失败。' }

      - name: Upload verified release files
        uses: actions/upload-artifact@v7
        with:
          name: REFramework-Chinese-Release
          path: release/*
          if-no-files-found: error

      - name: Create historical release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_RELEASE_TAG: ${{ needs.decide.outputs.upstream_release_tag }}
        shell: pwsh
        run: |
          $bundle = Get-Content -Raw release/bundle-info.json | ConvertFrom-Json
          $tag = $bundle.releaseTag
          if ($env:UPSTREAM_RELEASE_TAG -notmatch '^nightly-([0-9]{5})-') { throw '官方编号无效。' }
          $releaseTitle = "REFramework-汉化-$($Matches[1])"
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host '这组成品已有历史发布，不重复创建。'
            exit 0
          }
          gh release create $tag release/REFramework.zip release/VR.zip release/csharp-api.zip `
            release/SHA256SUMS.txt release/bundle-info.json `
            --repo $env:GITHUB_REPOSITORY `
            --title $releaseTitle `
            --notes-file release/release-notes.md
