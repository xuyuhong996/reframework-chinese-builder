name: Build and release REFramework Chinese

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      check_only:
        description: "仅检查版本，不重新打包"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: reframework-chinese-build
  cancel-in-progress: false

jobs:
  decide:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.interval.outputs.should_build }}
      upstream_release_tag: ${{ steps.interval.outputs.upstream_release_tag }}
      upstream_sha: ${{ steps.interval.outputs.upstream_sha }}
    steps:
      - id: interval
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_BUILD: ${{ github.event_name == 'workflow_dispatch' }}
          CHECK_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.check_only }}
        shell: bash
        run: |
          upstream_release_tag=$(gh api 'repos/praydog/REFramework-nightly/releases/latest' --jq '.tag_name')
          if [[ ! "$upstream_release_tag" =~ ^nightly-([0-9]{5})-([0-9a-f]{40})$ ]]; then
            echo "官方 Nightly 标签格式无法识别，已停止构建，避免生成错误版本。" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          upstream_sha=${BASH_REMATCH[2]}
          echo "upstream_release_tag=$upstream_release_tag" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=$upstream_sha" >> "$GITHUB_OUTPUT"

          latest_release=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" 2>/dev/null || true)
          latest_title=$(printf '%s' "$latest_release" | jq -r '.name // "尚未发布"')
          latest_notes=$(printf '%s' "$latest_release" | jq -r '.body // ""')
          {
            echo "## 汉化版本检查"
            printf '官方 Nightly 标签：`%s`\n\n' "$upstream_release_tag"
            printf '官方源码提交：`%s`\n\n' "$upstream_sha"
            printf '本仓库最新发布：%s\n\n' "${latest_title:-尚未发布}"
            printf '[下载最新汉化包](https://github.com/%s/releases/latest)\n\n' "$GITHUB_REPOSITORY"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$CHECK_ONLY" = "true" ]; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            if printf '%s' "$latest_notes" | grep -Fq "Nightly 发布: $upstream_release_tag"; then
              echo "本次结果：仅检查版本；汉化已与官方 Nightly 同步。" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "本次结果：仅检查版本；尚未发布对应的官方 Nightly。" >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 0
          fi

          if [ "$FORCE_BUILD" = "true" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "本次结果：手动触发，继续重新构建。" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if printf '%s' "$latest_notes" | grep -Fq "Nightly 发布: $upstream_release_tag"; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "本次结果：版本已同步，官方没有新 Nightly，正常跳过打包。" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "should_build=true" >> "$GITHUB_OUTPUT"
          echo "本次结果：尚未发布对应的官方 Nightly，继续汉化打包。" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: decide
    if: needs.decide.outputs.should_build == 'true'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Checkout matching official source
        uses: actions/checkout@v4
        with:
          repository: praydog/REFramework
          ref: ${{ needs.decide.outputs.upstream_sha }}
          path: REFramework-src
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build localized ZIP
        env:
          SKIP_GITHUB_PUBLISH: "1"
          UPSTREAM_SHA: ${{ needs.decide.outputs.upstream_sha }}
          UPSTREAM_RELEASE_TAG: ${{ needs.decide.outputs.upstream_release_tag }}
        shell: pwsh
        run: python build_chinese.py

      - name: Create historical release
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_RELEASE_TAG: ${{ needs.decide.outputs.upstream_release_tag }}
        shell: pwsh
        run: |
          $package = Get-ChildItem -Filter 'REF Nightly *.zip' -File |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if ($null -eq $package) { throw '未找到构建生成的 ZIP。' }

          $hash = (Get-FileHash -LiteralPath $package.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($env:UPSTREAM_RELEASE_TAG -notmatch '^nightly-(\d+)') {
            throw "无法识别 Nightly 编号: $env:UPSTREAM_RELEASE_TAG"
          }
          $nightlyNumber = $Matches[1]
          $releaseTitle = "REFramework-汉化-$nightlyNumber"
          $releaseAssetBase = "REFramework-$nightlyNumber"
          $releasePackage = Join-Path $package.DirectoryName "$releaseAssetBase.zip"
          $checksum = "$releasePackage.sha256"
          Copy-Item -LiteralPath $package.FullName -Destination $releasePackage
          Set-Content -LiteralPath $checksum -Value "$hash  $releaseAssetBase.zip" -Encoding ascii
          $tag = "build-$($hash.Substring(0, 12))"
          # GitHub 会过滤中文附件名；使用稳定的 ASCII 名称，中文名称保留在 Release 标题。

          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host '这个 ZIP 已有历史发布版本，不重复创建。'
            exit 0
          }

          gh release create $tag $releasePackage $checksum `
            --repo $env:GITHUB_REPOSITORY `
            --title $releaseTitle `
            --notes "由 GitHub Actions 的 Windows Visual Studio 2022 环境自动构建。`n`nNightly 发布: $env:UPSTREAM_RELEASE_TAG"
