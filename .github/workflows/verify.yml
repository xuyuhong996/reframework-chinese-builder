name: 验证代码与汉化行为

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: ocornut/imgui
          ref: 85b2fe8486190fa9326565a2fb5fccb6caea4396
          path: tests/upstream-imgui

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: 安装代码检查工具
        run: python -m pip install -r requirements-dev.txt

      - name: 检查代码与格式
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: 验证真实 C++ 翻译和 ImGui 行为
        env:
          REQUIRE_NATIVE_TESTS: "1"
          REQUIRE_IMGUI_TESTS: "1"
          IMGUI_TEST_SOURCE: ${{ github.workspace }}/tests/upstream-imgui
        run: python -m unittest discover -s tests -v
