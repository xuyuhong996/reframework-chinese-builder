name: 检查代码

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: 安装代码检查工具
        run: python -m pip install -r requirements-dev.txt

      - name: 检查代码与格式
        run: |
          python -m ruff check .
          python -m ruff format --check .
